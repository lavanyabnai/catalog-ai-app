[project]
name = "worker"
version = "0.1.0"
description = "catalog-ai Celery worker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.4.0",
    "redis>=5.0.6",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "boto3>=1.34.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "langfuse>=2.37.0",
    "sentry-sdk[celery]>=2.5.0",
    "pillow>=10.0.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
